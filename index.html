<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>贪吃蛇 · Snake</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1>🐍 贪吃蛇</h1>
      <div class="scores">
        <div class="score-box"><span class="label">分数</span><span id="score">0</span></div>
        <div class="score-box"><span class="label">最高</span><span id="best">0</span></div>
      </div>
    </header>
    <div class="bar">
      <p class="tip">方向键 / WASD / 滑动 控制 · 吃到苹果变长，别撞墙别咬自己</p>
      <button id="new">新游戏</button>
    </div>
    <div class="stage">
      <canvas id="game" width="400" height="400"></canvas>
      <div id="overlay" class="overlay hidden">
        <div class="panel">
          <div class="big" id="ov-title">游戏结束</div>
          <div class="sub" id="ov-sub"></div>
          <button id="ov-btn">再来一局</button>
        </div>
      </div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
